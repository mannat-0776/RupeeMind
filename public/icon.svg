<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F66F6" />
      <stop offset="100%" stop-color="#00D1FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="256" rx="112" fill="url(#glowGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- Core Indian Rupee Symbol + Brain AI Spark Icon -->
  <g filter="url(#dropShadow)" fill="#ffffff">
    <!-- Top Horizontal Bar 1 -->
    <rect x="160" y="145" width="192" height="32" rx="16" />
    <!-- Top Horizontal Bar 2 -->
    <rect x="160" y="205" width="168" height="32" rx="16" />
    <!-- Vertical Spine Stem -->
    <rect x="200" y="145" width="32" height="220" rx="16" />
    <!-- Loop Curve -->
    <path d="M 220 205 Q 310 205 310 265 Q 310 325 220 325 Z" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Diagonal Leg -->
    <path d="M 235 305 L 335 410" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- AI Pulse Nodes -->
  <circle cx="370" cy="140" r="18" fill="#10B981" stroke="#ffffff" stroke-width="6"/>
  <circle cx="395" cy="220" r="12" fill="#00D1FF" stroke="#ffffff" stroke-width="4"/>
  <circle cx="130" cy="350" r="14" fill="#F59E0B" stroke="#ffffff" stroke-width="4"/>
</svg>
